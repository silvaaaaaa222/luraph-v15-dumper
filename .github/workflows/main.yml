name: Dump Luraph v15

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Lua
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.3
    
    - name: Run Dumper
      run: |
        lua5.3 dumper.lua 25ms_get.lua.txt || true
    
    - name: Check Output
      run: |
        if [ -f output_dumped.lua ]; then
          echo "✅ Dump criado!"
          ls -lh output_dumped.lua
        else
          echo "⚠️ Arquivo não criado"
        fi
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dumped-code
        path: output_dumped.lua
        retention-days: 7
